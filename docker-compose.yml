name: nedochat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nedochat
      POSTGRES_PASSWORD: nedochat
      POSTGRES_DB: nedochat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nedochat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nedochat:nedochat@db:5432/nedochat
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    volumes:
      - avatars:/app/static
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  avatars:
