[project]
name = "nedochat"
readme = "README.md"
version = "0.1.0"
description = ""
authors = [
    {name = "alexcherch",email = "alexcherch0@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "fastapi (>=0.140.13,<0.141.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.0.0,<4.1.0)",
    "psycopg2-binary (>=2.9,<3.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "python-multipart (>=0.0.20,<0.1.0)",
    "slowapi (>=0.1.10,<0.2.0)"
]

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "websockets (>=17.0,<18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.py$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=nedochat --cov-report=term-missing"

